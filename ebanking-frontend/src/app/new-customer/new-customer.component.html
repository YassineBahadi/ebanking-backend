<div class="container">
    <div class="card col-md-6 offset-3 mt-2">
        <div class="card-header">
            New Customer
        </div>
        <div class="card-body">
            <form (ngSubmit)="handleSaveCustomer()" [formGroup]="newCustomerFormGroup">
                <div class="mb-3">
                    <label  class="form-label">Name :</label>
                    <input type="text" class="form-control" formControlName="name">
                    @if(newCustomerFormGroup.get('name')?.touched && newCustomerFormGroup.get('name')?.invalid){
                        <span class="text-danger">Name is required</span>
                    }
                </div>
                <div class="mb-3">
                    <label  class="form-label">Email :</label>
                    <input type="email" class="form-control" formControlName="email">
                      @if(newCustomerFormGroup.get('email')?.touched && newCustomerFormGroup.get('email')?.invalid){
                        <span class="text-danger">Email is not valid</span>
                    }
                </div>
                <button [disabled]="!newCustomerFormGroup.valid"  class="btn btn-success">Save</button>
            </form>
        </div>
    </div>
</div>
